<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مساحتنا الخاصة 💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #fff7e9;
            background: linear-gradient(145deg, #354766, #101b32);
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
            text-align: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(233, 198, 140, 0.6);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .heart {
            font-size: 48px;
        }

        h1 {
            color: #e9c68c;
            font-size: 25px;
            font-weight: normal;
        }

        p {
            color: #e4e4eb;
            font-size: 14px;
            line-height: 1.9;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 13px;
            border-radius: 12px;
            border: 1px solid rgba(233, 198, 140, 0.5);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #d0d2dc;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            border: none;
            border-radius: 12px;
            background: #e9c68c;
            color: #15233e;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .forgot {
            display: inline-block;
            margin-top: 18px;
            color: #e9c68c;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        #status {
            min-height: 25px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #e9c68c;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="heart">🤍</div>

        <h1>مساحتنا الخاصة</h1>

        <p>
            مكان صغير يجمع قلبينا،<br>
            مخصص لينا نحن الاتنين 💙
        </p>

        <form id="loginForm">
            <input
                id="email"
                type="email"
                placeholder="الإيميل المسجل في الموقع"
                autocomplete="username"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                دخول إلى مساحتنا 💌
            </button>
        </form>

        <a id="forgotPassword" class="forgot" href="#">
            نسيت كلمة المرور؟
        </a>

        <p id="status" role="status" aria-live="polite"></p>

        <a class="back" href="Index.html">
            الرجوع للصفحة الرئيسية
        </a>
    </main>

    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwgLS--kn5SYpv47yiF48cejBcHGF3WvA",
            authDomain: "our-special-world-9ac8f.firebaseapp.com",
            projectId: "our-special-world-9ac8f",
            storageBucket: "our-special-world-9ac8f.firebasestorage.app",
            messagingSenderId: "794782590242",
            appId: "1:794782590242:web:d775479f89923052a5b17b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const status = document.getElementById("status");
        const loginButton = document.getElementById("loginButton");
        const forgotPassword = document.getElementById("forgotPassword");

        function showError(error) {
            const messages = {
                "auth/invalid-email":
                    "الإيميل المكتوب غير صحيح. راجعي كتابته.",

                "auth/invalid-credential":
                    "بيانات الدخول غير مطابقة. ممكن تحتاجي إعادة تعيين كلمة المرور.",

                "auth/wrong-password":
                    "كلمة المرور غير صحيحة. جرّبي استعادتها من الرابط أدناه.",

                "auth/user-not-found":
                    "الحساب غير موجود في مشروع Firebase الحالي.",

                "auth/too-many-requests":
                    "محاولات الدخول كثيرة. انتظري شوية وحاولي لاحقاً.",

                "auth/network-request-failed":
                    "في مشكلة في الإنترنت. تأكدي من الاتصال وحاولي تاني.",

                "auth/operation-not-allowed":
                    "تسجيل الدخول بالإيميل غير مفعّل في إعدادات Firebase.",

                "auth/invalid-api-key":
                    "مفتاح Firebase غير صحيح. راجعي إعدادات المشروع."
            };

            return messages[error.code] ||
                "حصل خطأ أثناء تسجيل الدخول. رمز الخطأ: " +
                (error.code || "غير معروف");
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            status.textContent = "جاري التحقق من بياناتك...";
            loginButton.disabled = true;

            try {
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                status.textContent = "تم تسجيل الدخول بنجاح 💙";

                window.location.href = "Index.html";

            } catch (error) {
                console.error("Firebase login error:", error);

                status.textContent = showError(error);
                loginButton.disabled = false;
            }
        });

        forgotPassword.addEventListener("click", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                status.textContent =
                    "اكتبي إيميلك أولاً، وبعدها اضغطي نسيت كلمة المرور.";
                emailInput.focus();
                return;
            }

            status.textContent = "جاري إرسال طلب استعادة كلمة المرور...";
            forgotPassword.style.pointerEvents = "none";

            try {
                await sendPasswordResetEmail(auth, email);

                status.textContent =
                    "لو الحساب مسجل ويسمح بإرسال رسالة، حتوصلك رسالة استعادة كلمة المرور. راجعي صندوق الوارد والرسائل غير المرغوب فيها.";

            } catch (error) {
                console.error("Password reset error:", error);

                if (error.code === "auth/invalid-email") {
                    status.textContent =
                        "الإيميل غير صحيح. راجعي كتابته.";
                } else if (error.code === "auth/network-request-failed") {
                    status.textContent =
                        "تعذر الاتصال. راجعي الإنترنت وحاولي تاني.";
                } else {
                    status.textContent =
                        "ما قدرنا نرسل طلب الاستعادة. رمز الخطأ: " +
                        (error.code || "غير معروف");
                }
            } finally {
                forgotPassword.style.pointerEvents = "auto";
            }
        });
    </script>
</body>
</html>
